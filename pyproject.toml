[project]
name = "tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "annalaurams", email = "nalauramoura@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=2.18.0",
    "geobr>=0.2.2",
    "geopandas>=1.1.0",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "plotly>=5.24.0",
    "selenium>=4.40.0",
    "webdriver-manager>=4.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pyright>=1.1.408",
]

[project.scripts]
tcc = "tcc:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict" 



[project]
name = "tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "annalaurams", email = "nalauramoura@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geobr>=0.2.2",
    "geopandas>=1.1.0",
    "hdbscan>=0.8.44",
    "jinja2>=3.1.6",
    "kaleido>=1.3.0",
    "kneed>=0.8.6",
    "libpysal>=4.15.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "plotly>=5.24.0",
    "requests>=2.32.0",
    "scikit-learn>=1.9.0",
    "selenium>=4.40.0",
    "spopt>=0.7.0",
    "webdriver-manager>=4.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pyright>=1.1.408",
]

[project.scripts]
tcc = "tcc:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict" 



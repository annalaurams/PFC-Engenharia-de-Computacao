[project]
name = "tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "annalaurams", email = "nalauramoura@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.40.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.0",
    "pyright>=1.1.408",
]

[project.scripts]
tcc = "tcc:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict" 


